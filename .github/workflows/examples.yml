name: Examples
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  example:
    name: ${{ matrix.example.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # examples/ddm is excluded: it downloads external data and needs PySBI (Python/torch)
        example:
          - dir: gaussian2D
            script: bivariate_gaussian.jl
          - dir: linearode
            script: linearode.jl
          - dir: lotka_volterra
            script: lv_ode.jl
    env:
      # headless GR backend for Plots.jl
      GKSwstype: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=examples/${{ matrix.example.dir }} -e 'using Pkg; Pkg.instantiate()'
      # run from the repository root, since some examples write output to paths relative to it
      - name: Run example
        run: julia --project=examples/${{ matrix.example.dir }} --threads=auto examples/${{ matrix.example.dir }}/${{ matrix.example.script }}
